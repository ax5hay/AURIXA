global:
  environment: prod
  ingress:
    enabled: true
    routes:
      api: { host: api.aurixa.example }
      dashboard: { host: dashboard.aurixa.example }
      patient: { host: patient.aurixa.example }
      hospital: { host: hospital.aurixa.example }
  frontend:
    apiGatewayUrl: https://api.aurixa.example
  externalSecrets:
    enabled: true
    remoteSecretKey: aurixa/prod/application
  networkPolicy:
    ingressCidrs: ["10.30.0.0/16"]
    egressPrivateCidrs: ["10.30.0.0/16"]
defaults:
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 2000m, memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  pdb:
    enabled: true
    minAvailable: 2
migration:
  enabled: true
