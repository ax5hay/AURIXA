{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "aurixa.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    aurixa.io/revision: {{ .Values.global.release.revision | quote }}
    aurixa.io/commit: {{ .Values.global.release.commit | quote }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: aurixa-migration}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "aurixa.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "aurixa.image" (dict "root" . "service" .Values.migration) | quote }}
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "aurixa.fullname" (dict "root" . "name" "runtime") }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
