global:
  environment: staging
  ingress:
    enabled: true
    routes:
      api: { host: api.staging.aurixa.example }
      dashboard: { host: dashboard.staging.aurixa.example }
      client: { host: client.staging.aurixa.example, service: client-portal }
      workspace: { host: workspace.staging.aurixa.example, service: agent-workspace }
  frontend:
    apiGatewayUrl: https://api.staging.aurixa.example
  externalSecrets:
    enabled: true
    remoteSecretKey: aurixa/staging/application
  networkPolicy:
    ingressCidrs: ["10.20.0.0/16"]
    egressPrivateCidrs: ["10.20.0.0/16"]
defaults:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
migration:
  enabled: true
