name: Docker Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        name: Generate service matrix
        run: |
          services=$(jq -c '.' <<< '[
            {"name": "api-gateway", "path": "apps/api-gateway"},
            {"name": "orchestration-engine", "path": "apps/orchestration-engine"},
            {"name": "llm-router", "path": "apps/llm-router"},
            {"name": "agent-runtime", "path": "apps/agent-runtime"},
            {"name": "rag-service", "path": "apps/rag-service"},
            {"name": "safety-guardrails", "path": "apps/safety-guardrails"},
            {"name": "streaming-voice", "path": "apps/streaming-voice"},
            {"name": "execution-engine", "path": "apps/execution-engine"},
            {"name": "observability-core", "path": "apps/observability-core"},
            {"name": "deployment-controller", "path": "apps/deployment-controller"},
            {"name": "dashboard", "path": "frontend/dashboard"},
            {"name": "patient-portal", "path": "frontend/patient-portal"},
            {"name": "hospital-portal", "path": "frontend/hospital-portal"}
          ]')
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.build-matrix.outputs.services) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: false
          tags: aurixa/${{ matrix.service.name }}:ci-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Image digest
        run: echo "Built image with digest ${{ steps.build.outputs.digest }}"

  build-status:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more Docker builds did not succeed."
            exit 1
          fi
          echo "All Docker images built successfully."
