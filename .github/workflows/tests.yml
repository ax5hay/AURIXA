name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Type checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - apps/orchestration-engine
          - apps/llm-router
          - apps/agent-runtime
          - apps/rag-service
          - apps/safety-guardrails
          - apps/streaming-voice
          - apps/execution-engine
          - apps/observability-core
          - apps/deployment-controller
          - packages/db
          - packages/llm-clients

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system \
            -e packages/db \
            -e packages/llm-clients \
            -e "${{ matrix.service }}" \
            pytest \
            pytest-asyncio \
            pyright

      - name: Run type checking
        working-directory: ${{ matrix.service }}
        run: pyright .

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          set +e
          pytest -v
          status=$?
          set -e
          if [[ $status -eq 5 ]]; then
            echo "::notice::No tests were collected for ${{ matrix.service }}; skipping."
            echo "### ${{ matrix.service }}: no tests collected (skipped)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $status -ne 0 ]]; then
            echo "::error::Tests failed for ${{ matrix.service }} with exit code $status."
            exit "$status"
          fi
          echo "### ${{ matrix.service }}: tests passed" >> "$GITHUB_STEP_SUMMARY"

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UI kit unit tests
        run: pnpm --filter @aurixa/ui-kit test

      - name: Build UI kit
        run: pnpm --filter @aurixa/ui-kit build

      - name: Build portals for budgets
        env:
          PATIENT_DEMO_AUTH_ENABLED: "true"
          STAFF_DEMO_AUTH_ENABLED: "true"
          AUTH_SECRET: "ci-auth-secret-at-least-32-characters-long"
          PATIENT_SESSION_SECRET: "ci-patient-session-secret-32chars!!"
          STAFF_SESSION_SECRET: "ci-staff-session-secret-32-chars!!"
        run: |
          pnpm --filter @aurixa/dashboard build
          pnpm --filter @aurixa/patient-portal build
          pnpm --filter @aurixa/hospital-portal build

      - name: Enforce frontend bundle budgets
        run: pnpm run budget:frontends

  all-tests:
    if: always()
    needs: [test-typescript, test-python, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-typescript.result }}" != "success" ||
                "${{ needs.test-python.result }}" != "success" ||
                "${{ needs.frontend-quality.result }}" != "success" ]]; then
            echo "One or more required test jobs did not succeed."
            exit 1
          fi
          echo "All required test jobs passed."
